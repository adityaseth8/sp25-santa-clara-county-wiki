
<h2 class="sectionedit1" id="california_consumer_privacy_act">California Consumer Privacy Act</h2>
<div class="level2">

<p>
Landmark law in 2018 that gave California consumers new privacy rights including: (1) right to know, (2) right to delete, (3) right to opt-out, and (4) right to non-discrimination.
</p>

</div>
